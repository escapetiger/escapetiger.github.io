<!doctype html>
<html lang="zh">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow">
  <meta name="referrer" content="no-referrer">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; connect-src https://api.github.com; img-src 'self'; base-uri 'none'; form-action 'none'; object-src 'none'">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Blog Editor">
  <meta name="theme-color" content="#f5f3ee">
  <title>Blog Editor · Yi Cai</title>
  <link rel="apple-touch-icon" href="/favicon/apple-touch-icon.png">
  <link rel="stylesheet" href="admin.css">
  <script src="vendor/js-yaml.min.js" defer></script>
  <script src="app.mjs" type="module"></script>
</head>
<body>
  <header>
    <a href="/" aria-label="Yi Cai home">Yi Cai</a>
    <select id="locale" aria-label="Interface language"><option value="zh">中文</option><option value="en">English</option></select>
  </header>
  <main>
    <h1 data-i18n="heading">博客编辑 / Blog Editor</h1>
    <p data-i18n="intro"></p>
    <p id="status" role="status" aria-live="polite"></p>
    <section id="login">
      <form id="login-form">
        <label for="token" data-i18n="token"></label>
        <input id="token" type="password" autocomplete="off" autocapitalize="none" spellcheck="false" required>
        <p class="hint" data-i18n="tokenHelp"></p>
        <button type="submit" data-i18n="connect"></button>
        <a href="https://github.com/settings/personal-access-tokens/new" target="_blank" rel="noopener noreferrer" data-i18n="createToken"></a>
      </form>
    </section>
    <section id="workspace" hidden>
      <div class="toolbar">
        <button id="new" type="button" data-i18n="new"></button>
        <button id="refresh" type="button" data-i18n="refresh"></button>
        <button id="restore" type="button" data-i18n="restore"></button>
        <button id="logout" type="button" data-i18n="logout"></button>
      </div>
      <label for="search" data-i18n="search"></label>
      <input id="search" type="search" autocomplete="off" spellcheck="false">
      <label for="articles" data-i18n="articles"></label>
      <select id="articles"><option value=""></option></select>
      <form id="new-form" hidden>
        <label for="title" data-i18n="title"></label>
        <input id="title" required>
        <label for="language" data-i18n="language"></label>
        <select id="language"><option value="zh">中文</option><option value="en">English</option></select>
        <label for="slug" data-i18n="slug"></label>
        <input id="slug" value="misc/" autocapitalize="none" spellcheck="false" required>
        <button type="submit" data-i18n="create"></button>
      </form>
      <section id="editor" hidden>
        <label for="path" data-i18n="path"></label>
        <input id="path" autocapitalize="none" spellcheck="false">
        <label for="source" data-i18n="source"></label>
        <p class="hint" data-i18n="sourceHelp"></p>
        <textarea id="source" rows="24" spellcheck="false" autocapitalize="none" autocomplete="off" autocorrect="off"></textarea>
        <p id="backup-status" role="status"></p>
        <div class="actions">
          <button id="save-draft" type="button" data-i18n="saveDraft"></button>
          <button id="publish" type="button" class="primary" data-i18n="publish"></button>
          <button id="export" type="button" data-i18n="export"></button>
        </div>
        <p class="hint" data-i18n="draftHelp"></p>
        <p><a id="commit-link" hidden target="_blank" rel="noopener noreferrer" data-i18n="commit"></a></p>
      </section>
      <p><a href="https://github.com/escapetiger/hugo-yicai/actions/workflows/mobile-publish.yml" target="_blank" rel="noopener noreferrer" data-i18n="builds"></a></p>
    </section>
    <noscript>This editor requires JavaScript. / 此编辑器需要启用 JavaScript。</noscript>
  </main>
</body>
</html>
