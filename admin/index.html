<!doctype html>
<html lang="zh">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow">
  <meta name="referrer" content="no-referrer">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; connect-src 'self' https://api.github.com; frame-src 'self'; img-src 'self' blob:; base-uri 'none'; form-action 'none'; object-src 'none'">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Blog Editor">
  <meta name="theme-color" content="#f5f3ee">
  <title>Blog Editor · Yi Cai</title>
  <link rel="icon" href="/favicon/favicon.ico">
  <link rel="apple-touch-icon" href="/favicon/apple-touch-icon.png">
  <link rel="stylesheet" href="admin.css?v=4">
  <script src="vendor/js-yaml.min.js" defer></script>
  <script src="vendor/markdown-it.min.js" defer></script>
  <script src="vendor/purify.min.js" defer></script>
  <script src="vendor/katex/katex.min.js" defer></script>
  <script src="app.mjs?v=4" type="module"></script>
</head>
<body data-view="login">
  <header class="site-header">
    <a class="brand" href="/">Yi Cai <span data-i18n="brand"></span></a>
    <select id="locale" aria-label="Interface language"><option value="zh">中文</option><option value="en">English</option></select>
  </header>
  <main>
    <section id="login-view" class="view login-view">
      <p class="eyebrow">YI CAI / BLOG</p>
      <h1 data-i18n="loginHeading"></h1><p class="muted" data-i18n="loginIntro"></p>
      <p data-notice role="status" hidden></p>
      <form id="login-form" class="surface">
        <label for="token" data-i18n="token"></label>
        <input id="token" type="password" autocomplete="off" autocapitalize="none" spellcheck="false" required>
        <p class="hint" data-i18n="tokenHelp"></p>
        <label class="remember-option"><input id="remember-device" type="checkbox" aria-describedby="remember-help"><span data-i18n="rememberDevice"></span></label>
        <p id="remember-help" class="hint" data-i18n="rememberHelp"></p>
        <button class="primary full" type="submit" data-i18n="connect"></button>
        <a class="subtle-link" href="https://github.com/settings/personal-access-tokens/new" target="_blank" rel="noopener noreferrer" data-i18n="createToken"></a>
      </form>
      <div id="saved-login" class="saved-login" hidden><button id="retry-saved" data-i18n="retrySaved"></button><button id="forget-saved" class="quiet" data-i18n="forgetSaved"></button></div>
    </section>
    <section id="library-view" class="view" hidden>
      <div class="page-heading"><div><p class="eyebrow">YOUR NOTEBOOK</p><h1 data-i18n="heading"></h1></div><button id="new" class="primary" data-i18n="new"></button></div>
      <p class="muted" data-i18n="intro"></p>
      <p data-notice role="status" hidden></p>
      <label class="sr-only" for="search" data-i18n="search"></label><input id="search" type="search" autocomplete="off">
      <div class="filter-row">
        <label class="sr-only" for="filter-language" data-i18n="language"></label>
        <select id="filter-language"><option value="" data-i18n="allLanguages"></option><option value="zh">中文</option><option value="en">English</option></select>
        <label class="sr-only" for="filter-state" data-i18n="statusFilter"></label>
        <select id="filter-state"><option value="" data-i18n="allStates"></option><option value="draft" data-i18n="draft"></option><option value="public" data-i18n="public"></option><option value="scheduled" data-i18n="scheduled"></option></select>
        <button id="refresh" class="quiet" data-i18n="refresh"></button>
      </div>
      <p id="library-count" class="hint" role="status"></p>
      <div id="articles" class="article-grid"></div>
      <p id="connection-status" class="hint" role="status"></p>
      <div class="library-footer">
        <button id="resume" hidden data-i18n="resume"></button><button id="progress" hidden data-i18n="progress"></button>
        <button id="restore" class="quiet" data-i18n="restore"></button><button id="logout" class="quiet" data-i18n="logout"></button>
      </div>
    </section>
    <section id="new-view" class="view narrow" hidden>
      <button id="cancel-new" class="quiet back" data-i18n="cancel"></button><h1 data-i18n="new"></h1>
      <p data-notice role="status" hidden></p>
      <form id="new-form" class="surface">
        <label for="new-title" data-i18n="title"></label><input id="new-title" required>
        <label for="language" data-i18n="language"></label><select id="language"><option value="zh">中文</option><option value="en">English</option></select>
        <label for="topic" data-i18n="topic"></label><input id="topic" value="misc" autocapitalize="none" spellcheck="false" required>
        <label for="slug" data-i18n="slug"></label><input id="slug" autocapitalize="none" spellcheck="false" required>
        <p class="hint" data-i18n="slugHelp"></p><button class="primary full" type="submit" data-i18n="create"></button>
      </form>
    </section>
    <section id="editor-view" class="view editor-shell" hidden>
      <div class="editor-topbar">
        <button id="back" class="quiet" data-i18n="back"></button>
        <div class="editor-heading"><strong id="editor-title"></strong><span id="article-state" class="badge"></span></div>
        <details id="more-menu" class="more-menu"><summary data-i18n="more"></summary><div class="menu-panel"><button id="export" data-i18n="export"></button><button id="backup-copy" data-i18n="backupCopy"></button><button id="editor-backups" data-i18n="backups"></button><button id="retract" class="danger" data-i18n="retract" hidden></button></div></details>
      </div>
      <nav class="editor-tabs" aria-label="Editor"><button type="button" data-tab="body" aria-pressed="true" data-i18n="body"></button><button type="button" data-tab="preview" aria-pressed="false" data-i18n="preview"></button><button type="button" data-tab="info" aria-pressed="false" data-i18n="info"></button><button type="button" data-tab="advanced" aria-pressed="false" data-i18n="advanced"></button></nav>
      <p data-notice class="editor-notice" role="status" hidden></p>
      <div class="editor-content">
        <div id="body-panel" class="body-panel" data-panel="body">
          <div class="writing-tools" role="group" aria-label="Markdown">
            <button type="button" data-insert="heading" aria-label="Heading">H2</button><button type="button" data-insert="bold" aria-label="Bold"><strong>B</strong></button><button type="button" data-insert="link" data-i18n="insertLink"></button><button type="button" data-insert="list" data-i18n="insertList"></button><button type="button" data-insert="math" data-i18n="insertMath"></button><button id="insert-image" type="button" data-i18n="insertImage"></button>
            <input id="image-input" type="file" accept="image/jpeg,image/png,image/webp" multiple hidden>
          </div>
          <div id="image-tray" class="image-tray" hidden></div>
          <label class="sr-only" for="source" data-i18n="body"></label>
          <textarea id="source" spellcheck="false" autocapitalize="none" autocomplete="off" autocorrect="off"></textarea>
        </div>
        <div id="preview-panel" class="preview-panel" data-panel="preview" hidden><p class="hint preview-hint" data-i18n="previewHelp"></p><iframe id="preview-frame" title="Article preview" sandbox="allow-same-origin" src="preview.html?v=3"></iframe></div>
        <div id="info-panel" class="form-panel" data-panel="info" hidden>
          <label for="title" data-i18n="title"></label><input id="title" required>
          <label for="date" data-i18n="date"></label><input id="date" type="date">
          <label for="tags" data-i18n="tags"></label><input id="tags">
          <label for="categories" data-i18n="categories"></label><input id="categories">
          <p class="hint" data-i18n="taxonomyHelp"></p><p class="hint" data-i18n="bodyHint"></p>
        </div>
        <div id="advanced-panel" class="form-panel" data-panel="advanced" hidden>
          <label for="path" data-i18n="path"></label><input id="path" autocapitalize="none" spellcheck="false">
          <label for="raw-source" data-i18n="raw"></label><p class="hint" data-i18n="rawHelp"></p>
          <textarea id="raw-source" rows="18" spellcheck="false" autocapitalize="none" autocomplete="off" autocorrect="off"></textarea>
        </div>
      </div>
      <footer class="editor-footer"><p id="backup-status" role="status"></p><div class="actions"><button id="save-draft" data-i18n="saveDraft"></button><button id="publish" class="primary" data-i18n="publish"></button></div></footer>
    </section>
    <section id="backups-view" class="view" hidden>
      <button id="backups-back" class="quiet back" data-i18n="cancel"></button><div class="page-heading"><h1 data-i18n="backups"></h1><button id="backups-refresh" data-i18n="refresh"></button></div>
      <p class="hint" data-i18n="backupsHelp"></p><p data-notice role="status" hidden></p><div id="backups-list" class="backups-list"></div>
    </section>
    <section id="result-view" class="view narrow" hidden>
      <p class="eyebrow" data-i18n="progress"></p><h1 data-i18n="resultHeading"></h1>
      <p data-notice role="status" hidden></p>
      <div class="surface result-card">
        <p id="result-title" class="result-title"></p>
        <ol class="steps"><li id="step-source" data-i18n="submitted"></li><li id="step-build" data-i18n="buildStep"></li><li id="step-live" data-i18n="liveStep"></li></ol>
        <h2 id="result-status" role="status" aria-live="polite"></h2><p id="result-help" class="muted"></p>
        <a id="view-article" class="button primary full" target="_blank" rel="noopener noreferrer" data-i18n="viewArticle" hidden></a>
        <div class="result-links"><a id="commit-link" target="_blank" rel="noopener noreferrer" data-i18n="commit"></a><a id="build-link" target="_blank" rel="noopener noreferrer" data-i18n="builds"></a></div>
        <button id="check-status" class="quiet full" data-i18n="checkStatus"></button>
      </div>
      <div class="result-actions"><button id="continue-editing" data-i18n="continueEditing"></button><button id="result-back" class="quiet" data-i18n="resultBack"></button></div>
      <p class="hint" data-i18n="desktopHint"></p>
    </section>
    <noscript>This editor requires JavaScript. / 此编辑器需要启用 JavaScript。</noscript>
  </main>
</body>
</html>
