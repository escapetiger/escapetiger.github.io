<!doctype html>
<html lang="zh">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow">
  <meta name="referrer" content="no-referrer">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; font-src 'self'; connect-src 'self' https://api.github.com; frame-src 'self'; img-src 'self' blob:; base-uri 'none'; form-action 'none'; object-src 'none'">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Blog Editor">
  <meta name="theme-color" content="#f5f3ee">
  <title>Blog Editor · Yi Cai</title>
  <link rel="icon" href="/favicon/favicon.ico">
  <link rel="apple-touch-icon" href="/favicon/apple-touch-icon.png">
  <script src="appearance.js?v=9"></script>
  <link rel="stylesheet" href="ink-click.css?v=15">
  <script src="ink-click.js?v=14" defer></script>
  <link id="editor-fonts" rel="stylesheet" href="vendor/wenkai/font.css" media="print">
  <link rel="stylesheet" href="site.css?v=6">
  <link rel="stylesheet" href="admin.css?v=13">
  <script src="vendor/js-yaml.min.js" defer></script>
  <script src="app.mjs?v=13" type="module"></script>
</head>
<body data-view="login">
  <header class="site-header">
    <div class="nav-left"><a id="editor-home" class="brand" href="#home">Yi Cai</a>
    <div class="site-tools"><button id="theme-toggle" class="quiet theme-toggle" type="button" data-theme-toggle accesskey="t" aria-label="Toggle theme"><svg id="moon" class="moon" xmlns="http://www.w3.org/2000/svg" width="24" height="18" viewBox="0 0 24 24"
                        fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                        stroke-linejoin="round">
                        <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
                    </svg><svg id="sun" class="sun" xmlns="http://www.w3.org/2000/svg" width="24" height="18" viewBox="0 0 24 24"
                        fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                        stroke-linejoin="round">
                        <circle cx="12" cy="12" r="5"></circle>
                        <line x1="12" y1="1" x2="12" y2="3"></line>
                        <line x1="12" y1="21" x2="12" y2="23"></line>
                        <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
                        <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
                        <line x1="1" y1="12" x2="3" y2="12"></line>
                        <line x1="21" y1="12" x2="23" y2="12"></line>
                        <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
                        <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
                    </svg></button><span class="nav-sep" aria-hidden="true">|</span><button id="locale" class="quiet language-toggle" type="button" aria-label="Switch language">En</button></div></div>
    <nav class="section-menu" aria-label="Edit section"><button type="button" data-section="cv" data-i18n="navCV">CV</button><button type="button" data-section="publications" data-i18n="navPublications">Publications</button><button type="button" data-section="blog" data-i18n="navBlog">Blog</button></nav>
  </header>
  <main>
    <section id="login-view" class="view login-view">
      <h1 data-i18n="loginHeading"></h1>
      <p data-notice role="status" hidden></p>
      <div id="github-login-panel" class="surface" hidden>
        <a id="github-login" class="button primary full" href="/admin/auth/login" data-i18n="githubLogin"></a>
      </div>
      <button id="login-retry" class="quiet" data-i18n="retryLogin"></button>
      <form id="login-form" class="surface" hidden>
        <label for="token" data-i18n="token"></label>
        <input id="token" type="password" autocomplete="off" autocapitalize="none" spellcheck="false" required>
        <label class="remember-option"><input id="remember-device" type="checkbox"><span data-i18n="rememberDevice"></span></label>
        <button class="primary full" type="submit" data-i18n="connect"></button>
        <a class="subtle-link" href="https://github.com/settings/personal-access-tokens/new" target="_blank" rel="noopener noreferrer" data-i18n="createToken"></a>
      </form>
      <div id="saved-login" class="saved-login" hidden><button id="retry-saved" data-i18n="retrySaved"></button><button id="forget-saved" class="quiet" data-i18n="forgetSaved"></button></div>
    </section>
    <section id="home-view" class="view home-view" hidden>
      <h1 data-i18n="homeHeading"></h1>
      <p data-notice role="status" hidden></p>
      <div class="home-grid">
        <button type="button" class="home-card" data-open-section="cv"><strong data-i18n="navCV"></strong><span class="badge" data-local-edits="cv" data-i18n="localEdits" hidden></span><span class="home-arrow" aria-hidden="true">→</span></button>
        <button type="button" class="home-card" data-open-section="publications"><strong data-i18n="navPublications"></strong><span class="badge" data-local-edits="publications" data-i18n="localEdits" hidden></span><span class="home-arrow" aria-hidden="true">→</span></button>
        <button type="button" class="home-card" data-open-section="blog"><strong data-i18n="navBlog"></strong><span class="badge" data-local-edits="blog" data-i18n="localEdits" hidden></span><span class="home-arrow" aria-hidden="true">→</span></button>
      </div>
      <div class="library-footer"><button id="home-resume" data-i18n="resume" hidden></button><button id="home-progress" data-i18n="progress" hidden></button><button id="home-backups" class="quiet" data-i18n="restore"></button></div>
      <footer class="home-footer"><div><p id="home-connection" class="hint" role="status"></p><button id="home-logout" class="quiet" data-i18n="logout"></button></div><a id="published-site" target="_blank" rel="noopener noreferrer"><span data-i18n="viewPublishedSite"></span> ↗</a></footer>
    </section>
    <section id="library-view" class="view" hidden>
      <div class="page-heading"><div><h1 data-i18n="heading"></h1></div><button id="new" class="primary" data-i18n="new"></button></div>
      <p data-notice role="status" hidden></p>
      <label class="sr-only" for="search" data-i18n="search"></label><input id="search" type="search" autocomplete="off">
      <div class="filter-row">
        <label class="sr-only" for="filter-state" data-i18n="statusFilter"></label>
        <select id="filter-state"><option value="" data-i18n="allStates"></option><option value="draft" data-i18n="draft"></option><option value="public" data-i18n="public"></option><option value="scheduled" data-i18n="scheduled"></option></select>
        <button id="refresh" class="quiet" data-i18n="refresh"></button>
      </div>
      <div class="taxonomy-filters">
        <label><span data-i18n="categories"></span><select id="filter-category"><option value="" data-i18n="allCategories"></option></select></label>
        <label><span data-i18n="tags"></span><select id="filter-tag"><option value="" data-i18n="allTags"></option></select></label>
        <label><span data-i18n="publicationYear"></span><select id="filter-year"><option value="" data-i18n="allYears"></option></select></label>
      </div>
      <p id="library-count" class="hint" role="status"></p>
      <div id="articles" class="article-grid"></div>
      <p id="connection-status" class="hint" role="status"></p>
      <div class="library-footer">
        <button id="resume" hidden data-i18n="resume"></button><button id="progress" hidden data-i18n="progress"></button>
        <button id="restore" class="quiet" data-i18n="restore"></button><button id="logout" class="quiet" data-i18n="logout"></button>
      </div>
    </section>
    <section id="data-view" class="view" hidden>
      <p data-notice role="status" hidden></p>
      <div id="data-content"></div>
      <div class="data-actions"><button id="data-export" type="button" data-i18n="export"></button><button id="data-reload" type="button" data-i18n="refresh"></button><button id="data-publish" type="button" class="primary" data-i18n="publish"></button></div>
    </section>
    <section id="new-view" class="view narrow" hidden>
      <button id="cancel-new" class="quiet back" data-i18n="cancel"></button><h1 data-i18n="new"></h1>
      <p data-notice role="status" hidden></p>
      <form id="new-form" class="surface">
        <label for="new-title" data-i18n="title"></label><input id="new-title" required>
        <label for="language" data-i18n="language"></label><select id="language"><option value="zh">中文</option><option value="en">English</option></select>
        <label for="topic" data-i18n="topic"></label><input id="topic" value="misc" autocapitalize="none" spellcheck="false" required>
        <label for="slug" data-i18n="slug"></label><input id="slug" autocapitalize="none" spellcheck="false" required>
        <button class="primary full" type="submit" data-i18n="create"></button>
      </form>
    </section>
    <section id="editor-view" class="view editor-shell" hidden>
      <div class="editor-topbar">
        <button id="back" class="quiet" data-i18n="back"></button>
        <div class="editor-heading"><strong id="editor-title"></strong><span id="article-state" class="badge"></span><span id="editor-meta" class="editor-meta"></span></div>
        <details id="more-menu" class="more-menu"><summary data-i18n="more"></summary><div class="menu-panel"><button id="reauth" data-i18n="reauth" hidden></button><button id="export" data-i18n="export"></button><button id="backup-copy" data-i18n="backupCopy"></button><button id="editor-backups" data-i18n="backups"></button><button id="retract" class="danger" data-i18n="retract" hidden></button></div></details>
      </div>
      <nav class="editor-tabs" aria-label="Editor"><button type="button" data-tab="body" aria-pressed="true" data-i18n="body"></button><button type="button" data-tab="preview" aria-pressed="false" data-i18n="preview"></button><button type="button" data-tab="info" aria-pressed="false" data-i18n="info"></button><button type="button" data-tab="advanced" aria-pressed="false" data-i18n="advanced"></button></nav>
      <p data-notice class="editor-notice" role="status" hidden></p>
      <div class="editor-content">
        <div id="body-panel" class="body-panel" data-panel="body">
          <div class="writing-tools" role="group" aria-label="Markdown">
            <button type="button" data-insert="heading" aria-label="Heading">H2</button><button type="button" data-insert="bold" aria-label="Bold"><strong>B</strong></button><button type="button" data-insert="link" data-i18n="insertLink"></button><button type="button" data-insert="list" data-i18n="insertList"></button><button type="button" data-insert="math" data-i18n="insertMath"></button><button id="insert-image" type="button" data-i18n="insertImage"></button>
            <input id="image-input" type="file" accept="image/jpeg,image/png,image/webp" multiple hidden>
          </div>
          <div id="image-tray" class="image-tray" hidden></div>
          <label class="sr-only" for="source" data-i18n="body"></label>
          <textarea id="source" spellcheck="false" autocapitalize="none" autocomplete="off" autocorrect="off"></textarea>
        </div>
        <div id="preview-panel" class="preview-panel" data-panel="preview" hidden><p id="preview-loading" class="hint preview-hint" role="status" data-i18n="previewLoading" hidden></p><iframe id="preview-frame" title="Article preview" sandbox="allow-same-origin" data-src="preview.html?v=6"></iframe></div>
        <div id="info-panel" class="form-panel" data-panel="info" hidden>
          <label for="title" data-i18n="title"></label><input id="title" required>
          <label for="date" data-i18n="date"></label><input id="date" type="date">
          <label for="tags" data-i18n="tags"></label><input id="tags">
          <label for="categories" data-i18n="categories"></label><input id="categories">
        </div>
        <div id="advanced-panel" class="form-panel" data-panel="advanced" hidden>
          <label for="path" data-i18n="path"></label><input id="path" autocapitalize="none" spellcheck="false">
          <label for="raw-source" data-i18n="raw"></label>
          <textarea id="raw-source" rows="18" spellcheck="false" autocapitalize="none" autocomplete="off" autocorrect="off"></textarea>
        </div>
      </div>
      <footer class="editor-footer"><p id="backup-status" role="status"></p><div class="actions"><button id="save-draft" data-i18n="saveDraft"></button><button id="publish" class="primary" data-i18n="publish"></button></div></footer>
    </section>
    <section id="backups-view" class="view" hidden>
      <button id="backups-back" class="quiet back" data-i18n="cancel"></button><div class="page-heading"><h1 data-i18n="backups"></h1><button id="backups-refresh" data-i18n="refresh"></button></div>
      <p data-notice role="status" hidden></p><div id="backups-list" class="backups-list"></div>
    </section>
    <section id="result-view" class="view narrow" hidden>
      <h1 data-i18n="resultHeading"></h1>
      <p data-notice role="status" hidden></p>
      <div class="surface result-card">
        <p id="result-title" class="result-title"></p>
        <ol class="steps"><li id="step-source" data-i18n="submitted"></li><li id="step-build" data-i18n="buildStep"></li><li id="step-live" data-i18n="liveStep"></li></ol>
        <h2 id="result-status" role="status" aria-live="polite"></h2><p id="result-help" class="muted"></p>
        <a id="view-article" class="button primary full" target="_blank" rel="noopener noreferrer" data-i18n="viewArticle" hidden></a>
        <div class="result-links"><a id="commit-link" target="_blank" rel="noopener noreferrer" data-i18n="commit"></a><a id="build-link" target="_blank" rel="noopener noreferrer" data-i18n="builds"></a></div>
        <button id="check-status" class="quiet full" data-i18n="checkStatus"></button>
      </div>
      <div class="result-actions"><button id="continue-editing" data-i18n="continueEditing"></button><button id="result-back" class="quiet" data-i18n="resultBack"></button></div>
    </section>
    <noscript>This editor requires JavaScript. / 此编辑器需要启用 JavaScript。</noscript>
  </main>
</body>
</html>
